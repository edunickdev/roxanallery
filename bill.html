<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturas Entra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        @media print {
            .no-print { display: none !important; }
            .print-shadow-none { box-shadow: none !important; }
            .print-border-none { border: none !important; }
            body { background-color: white !important; }
            .invoice-container { padding: 0 !important; margin: 0 !important; border: none !important; }
        }
        .circuit-bg {
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 250px;
            height: 250px;
            opacity: 0.1;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4 print:bg-white print:py-0" x-data="invoiceApp()">

    <div class="max-w-4xl mx-auto">
        <!-- Toolbar -->
        <div class="mb-6 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Generador de Facturas Entra</h1>
                <p class="text-sm text-slate-500">Formato Web Interactivo</p>
            </div>
            <button @click="window.print()" class="flex items-center gap-2 bg-[#008eb0] hover:bg-[#007694] text-white px-6 py-2.5 rounded-full transition-all shadow-md font-semibold">
                <i data-lucide="printer" class="w-5 h-5"></i>
                Descargar PDF / Imprimir
            </button>
        </div>

        <!-- Invoice Card -->
        <div class="relative bg-white shadow-2xl rounded-2xl overflow-hidden print-shadow-none print-border-none p-10 md:p-16 invoice-container">
            
            <!-- Circuit Decoration -->
            <svg class="circuit-bg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 160H60L80 140H120L130 150H160" stroke="#8ed1e0" stroke-width="4"/>
                <circle cx="165" cy="150" r="5" fill="#8ed1e0"/>
                <path d="M0 180H40L60 160H100L115 175H180" stroke="#8ed1e0" stroke-width="4"/>
                <circle cx="185" cy="175" r="5" fill="#8ed1e0"/>
                <path d="M20 200V185L40 165" stroke="#8ed1e0" stroke-width="4"/>
            </svg>

            <!-- Header -->
            <div class="relative flex flex-col md:flex-row justify-between mb-12">
                <div class="z-10">
                    <!-- Logo -->
                    <div class="flex items-end gap-1 mb-6">
                        <span class="text-4xl font-black tracking-tighter" style="color: #008eb0">entra</span>
                        <div class="w-3 h-3 rounded-full mb-2" style="background-color: #f39200"></div>
                    </div>
                    
                    <div class="space-y-1.5 text-sm text-slate-500 text-left">
                        <input type="text" x-model="company.name" class="font-bold text-slate-700 w-full border-none p-0 focus:ring-0 bg-transparent outline-none">
                        <div class="flex items-center gap-2">
                            <span class="font-medium">NIT:</span>
                            <input type="text" x-model="company.id" class="w-40 border-none p-0 focus:ring-0 bg-transparent outline-none">
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="map-pin" class="w-3 h-3 text-[#8ed1e0]"></i>
                            <input type="text" x-model="company.address" class="w-full border-none p-0 focus:ring-0 bg-transparent outline-none">
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="mail" class="w-3 h-3 text-[#8ed1e0]"></i>
                            <input type="text" x-model="company.email" class="w-full border-none p-0 focus:ring-0 bg-transparent outline-none">
                        </div>
                    </div>
                </div>

                <div class="mt-8 md:mt-0 text-right">
                    <h2 class="text-5xl font-black text-slate-100 uppercase mb-4 select-none">Factura</h2>
                    <div class="space-y-1">
                        <div class="bg-[#008eb0] text-white px-4 py-1 rounded-l-lg inline-block font-bold">
                            # <input type="text" x-model="invoiceNumber" class="bg-transparent border-none p-0 focus:ring-0 w-24 text-right">
                        </div>
                        <div class="text-sm pt-4 flex flex-col gap-1">
                            <p><span class="text-slate-400 font-medium">Emisión:</span> <input type="date" x-model="issueDate" class="bg-transparent border-none p-0 focus:ring-0 text-right"></p>
                            <p><span class="text-slate-400 font-medium">Vencimiento:</span> <input type="date" x-model="dueDate" class="bg-transparent border-none p-0 focus:ring-0 text-right text-orange-600 font-bold"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Client Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-12">
                <div class="border-l-4 border-[#f39200] pl-6 py-2 text-left">
                    <h3 class="text-xs font-black text-[#008eb0] uppercase tracking-widest mb-3">Información del Cliente</h3>
                    <input type="text" x-model="client.name" class="block w-full text-lg font-bold text-slate-800 border-none p-0 focus:ring-0 bg-transparent outline-none" placeholder="Nombre del Cliente">
                    <input type="text" x-model="client.id" class="block w-full text-slate-500 border-none p-0 focus:ring-0 text-sm mt-1 bg-transparent outline-none" placeholder="NIT / CC">
                    <input type="text" x-model="client.address" class="block w-full text-slate-500 border-none p-0 focus:ring-0 text-sm mt-1 bg-transparent outline-none" placeholder="Dirección">
                </div>
            </div>

            <!-- Items Table -->
            <div class="mb-10 overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-slate-400 text-[10px] uppercase tracking-widest">
                            <th class="pb-4 font-black">Descripción del Servicio</th>
                            <th class="pb-4 font-black text-center">Cant.</th>
                            <th class="pb-4 font-black text-right">Precio Unitario</th>
                            <th class="pb-4 font-black text-right">Total</th>
                            <th class="pb-4 no-print"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        <template x-for="(item, index) in items" :key="item.id">
                            <tr class="group">
                                <td class="py-5 text-left">
                                    <input type="text" x-model="item.description" class="w-full border-none p-0 focus:ring-0 text-slate-700 font-medium bg-transparent outline-none" placeholder="Descripción del servicio...">
                                </td>
                                <td class="py-5 text-center">
                                    <input type="number" x-model.number="item.quantity" class="w-12 text-center border-none p-0 focus:ring-0 text-slate-600 bg-slate-50 rounded outline-none">
                                </td>
                                <td class="py-5 text-right">
                                    <div class="flex items-center justify-end">
                                        <span class="text-slate-400 text-xs mr-1">$</span>
                                        <input type="number" x-model.number="item.price" class="w-28 text-right border-none p-0 focus:ring-0 text-slate-600 bg-transparent outline-none">
                                    </div>
                                </td>
                                <td class="py-5 text-right font-bold text-slate-900" x-text="'$' + (item.quantity * item.price).toLocaleString()"></td>
                                <td class="py-5 text-right no-print pl-4">
                                    <button @click="removeItem(item.id)" class="text-slate-200 hover:text-red-400 transition-colors">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                
                <button @click="addItem()" class="mt-6 flex items-center gap-2 text-xs font-black text-[#008eb0] uppercase tracking-wider hover:text-[#f39200] transition-colors no-print">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Agregar concepto
                </button>
            </div>

            <!-- Summary Section -->
            <div class="flex flex-col md:flex-row justify-between gap-12 pt-10 border-t-2 border-slate-50">
                <div class="flex-1 space-y-6 text-sm text-left">
                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                        <div class="flex items-center gap-2 text-[#008eb0] font-black uppercase text-[10px] mb-3">
                            <i data-lucide="receipt" class="w-3.5 h-3.5"></i> Notas y Términos
                        </div>
                        <textarea x-model="notes" class="w-full text-slate-500 bg-transparent border-none p-0 focus:ring-0 min-h-[60px] leading-relaxed resize-none outline-none"></textarea>
                    </div>
                    <div class="px-6">
                        <div class="flex items-center gap-2 text-[#f39200] font-black uppercase text-[10px] mb-2">
                            <i data-lucide="credit-card" class="w-3.5 h-3.5"></i> Detalles de Transferencia
                        </div>
                        <input type="text" x-model="paymentDetails" class="w-full font-bold text-slate-700 border-none p-0 focus:ring-0 bg-transparent outline-none">
                    </div>
                </div>

                <div class="w-full md:w-72 space-y-4">
                    <div class="flex justify-between text-slate-400 font-medium px-4">
                        <span>Subtotal</span>
                        <span x-text="'$' + subtotal().toLocaleString()"></span>
                    </div>
                    <div class="flex justify-between items-center text-slate-400 font-medium px-4">
                        <div class="flex items-center gap-2">
                            <span>IVA (<input type="number" x-model.number="taxRate" class="w-8 bg-transparent border-none p-0 focus:ring-0 text-slate-400 text-center">%)</span>
                        </div>
                        <span x-text="'$' + tax().toLocaleString()"></span>
                    </div>
                    <div class="flex justify-between text-2xl font-black bg-[#008eb0] text-white p-6 rounded-2xl shadow-lg shadow-blue-100">
                        <span>Total</span>
                        <span x-text="'$' + total().toLocaleString()"></span>
                    </div>
                </div>
            </div>

            <!-- Footer Branding -->
            <div class="mt-20 pt-10 border-t border-slate-50 flex justify-between items-center opacity-40">
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">
                    entra. tech solutions &copy; 2026
                </div>
                <div class="h-1 w-24 bg-gradient-to-r from-[#008eb0] via-[#f39200] to-transparent rounded-full"></div>
            </div>
        </div>
    </div>

    <script>
        function invoiceApp() {
            return {
                invoiceNumber: "INV-2024-001",
                issueDate: new Date().toISOString().split('T')[0],
                dueDate: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                company: {
                    name: "Entra Soluciones Tech",
                    id: "900.555.222-1",
                    address: "Calle de la Innovación 45, Edificio Nexus",
                    email: "contacto@entra.com"
                },
                client: {
                    name: "Nombre del Cliente o Empresa",
                    id: "NIT / CC",
                    address: "Dirección de correspondencia"
                },
                items: [
                    { id: 1, description: "Consultoría en Infraestructura Digital", quantity: 1, price: 1250000 },
                    { id: 2, description: "Soporte Técnico Especializado (Horas)", quantity: 10, price: 85000 }
                ],
                taxRate: 19,
                notes: "Este documento se rige bajo los términos de servicios tecnológicos de Entra.",
                paymentDetails: "Bancolombia - Cuenta de Ahorros: 002-123456-78",
                
                addItem() {
                    this.items.push({ id: Date.now(), description: "", quantity: 1, price: 0 });
                    setTimeout(() => lucide.createIcons(), 10);
                },
                removeItem(id) {
                    this.items = this.items.filter(i => i.id !== id);
                },
                subtotal() {
                    return this.items.reduce((acc, item) => acc + (item.quantity * item.price), 0);
                },
                tax() {
                    return this.subtotal() * (this.taxRate / 100);
                },
                total() {
                    return this.subtotal() + this.tax();
                },
                init() {
                    lucide.createIcons();
                }
            }
        }
    </script>
</body>
</html>
